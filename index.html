<title>半導體城市</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: dark "glowing tech-city" world — islands floating in bright teal water (Three.js). Central TSMC R&D Center + six themed-landmark districts; floating course-name labels beside each island; scene left, info panel right (stacks on phone). Deliberate single dark theme. */
:root{
  color-scheme: dark;
  --bg:#07161a; --bg2:#0a2026;
  --panel:#0c2429; --panel2:#0f2d33;
  --line:rgba(90,214,201,.16); --line-2:rgba(90,214,201,.32);
  --teal:#35e0cf; --teal-dp:#16998f;
  --gold:#f4c45c; --gold-dp:#d79a2e;
  --ink:#eaf7f4; --muted:#8fb3af; --muted-2:#5e8480;
  --font-ui:'Chakra Petch','Noto Sans TC',system-ui,sans-serif;
  --font-cjk:'Noto Sans TC','Chakra Petch',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-cjk);color:var(--ink);min-height:100%;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 700px at 72% -10%, rgba(53,224,207,.10), transparent 60%),radial-gradient(900px 600px at 10% 110%, rgba(244,196,92,.07), transparent 55%),linear-gradient(180deg, var(--bg2), var(--bg) 60%);background-attachment:fixed}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:30px 46px}
header{margin-bottom:22px}
.eyebrow{font-family:var(--font-ui);font-weight:600;font-size:12.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--teal);display:flex;align-items:center;gap:12px;margin-bottom:12px}
.eyebrow::before{content:"";width:34px;height:1px;background:linear-gradient(90deg,var(--teal),transparent)}
h1{font-family:var(--font-cjk);font-weight:900;font-size:clamp(34px,6vw,58px);line-height:1.02;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 .chip{color:var(--gold)}
.lede{margin:14px 0 0;max-width:60ch;color:var(--muted);font-size:clamp(14.5px,1.7vw,16.5px)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start;margin-top:22px}
.map-card{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(180deg, rgba(10,45,52,.7), rgba(6,24,30,.7))}
#scene{width:100%;height:clamp(460px,76vh,820px);display:block;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
#scene.hot{cursor:pointer}
#labels{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.map-tag{position:absolute;top:14px;left:14px;z-index:3;font-family:var(--font-ui);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#cdecE7;background:rgba(5,18,23,.62);border:1px solid rgba(90,214,201,.2);border-radius:8px;padding:5px 11px;pointer-events:none;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.map-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;font-size:12.5px;color:#dff3f0;letter-spacing:.03em;background:rgba(5,18,23,.64);border:1px solid rgba(90,214,201,.22);border-radius:999px;padding:7px 16px;pointer-events:none;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);white-space:nowrap}
.map-hint b{color:var(--teal);font-weight:700}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--font-ui);letter-spacing:.2em;font-size:12px;z-index:4}
/* floating island labels */
.lbl{position:absolute;left:0;top:0;display:flex;align-items:baseline;gap:7px;white-space:nowrap;background:rgba(8,28,33,.86);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;pointer-events:auto;cursor:pointer;transition:border-color .18s,background .18s;will-change:transform;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.lbl::after{content:"";position:absolute;left:50%;bottom:-7px;width:1px;height:7px;background:var(--line-2);transform:translateX(-50%)}
.lbl:hover,.lbl.active{border-color:var(--gold);background:rgba(18,48,54,.96)}
.lbl .ln{font-family:var(--font-ui);font-size:11px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.lbl .lt{font-family:var(--font-cjk);font-weight:700;font-size:13px;color:var(--ink);line-height:1.1}
.lbl.core{background:rgba(32,24,8,.86);border-color:var(--gold-dp)}
.lbl.core .lt{color:var(--gold)}
@media (max-width:620px){.lbl{display:none}}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px 20px 16px;position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 40px);overflow:auto}
.panel-eyebrow{font-family:var(--font-ui);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted-2);margin-bottom:14px}
.panel-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.panel-num{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--gold);border:1px solid var(--gold-dp);border-radius:9px;padding:6px 9px;line-height:1;flex:none;background:rgba(244,196,92,.07)}
.panel-title{font-family:var(--font-cjk);font-weight:900;font-size:24px;margin:0;line-height:1.12;text-wrap:balance}
.panel-sub{font-family:var(--font-ui);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin:5px 0 0}
.panel-blurb{color:var(--muted);font-size:14px;margin:4px 0 16px}
.panel-meta{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--font-ui);font-size:12px;color:var(--muted-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:16px;letter-spacing:.06em}
.panel-meta b{color:var(--teal);font-weight:600;font-size:15px}
.tnum{font-variant-numeric:tabular-nums}
.course-list{display:flex;flex-direction:column;gap:8px}
.ctitle{display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px 14px;transition:border-color .2s,transform .2s}
.ctitle:hover{border-color:var(--line-2);transform:translateX(2px)}
.ctitle .idx{font-family:var(--font-ui);font-size:11px;font-weight:600;color:var(--gold);min-width:18px;font-variant-numeric:tabular-nums}
.ctitle .ct{font-family:var(--font-cjk);font-weight:600;font-size:14.5px;color:var(--ink);line-height:1.4}
.empty{text-align:center;padding:34px 16px;border:1px dashed var(--line-2);border-radius:14px;background:rgba(53,224,207,.03)}
.empty-badge{display:inline-block;font-family:var(--font-ui);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-dp);border-radius:999px;padding:5px 14px;margin-bottom:12px}
.empty p{color:var(--muted);font-size:13.5px;margin:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chip-btn{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:11px 12px;cursor:pointer;color:var(--ink);font-family:var(--font-cjk);transition:border-color .2s,transform .2s,background .2s;display:flex;flex-direction:column;gap:3px}
.chip-btn:hover{border-color:var(--teal);transform:translateY(-2px);background:rgba(21,61,67,.7)}
.chip-btn .cn{font-family:var(--font-ui);font-size:11px;color:var(--gold);letter-spacing:.06em}
.chip-btn .ct{font-weight:700;font-size:14.5px}
.chip-btn .cc{font-family:var(--font-ui);font-size:11px;color:var(--muted-2);letter-spacing:.04em}
.panel-foot{margin:18px 0 2px;padding-top:13px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted-2);line-height:1.5}
.back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;background:none;border:none;color:var(--teal);font-family:var(--font-ui);font-size:12px;letter-spacing:.08em;padding:0;margin-bottom:14px}
.back:hover{color:var(--gold)}
footer{margin-top:30px;text-align:center;font-family:var(--font-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-2)}
@media (max-width:860px){.stage{grid-template-columns:1fr;gap:16px}.panel{position:static;max-height:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Semiconductor City · 晶片之城</div>
    <h1>半導體城市 <span class="chip">TSMC</span></h1>
    <p class="lede">一座漂在海上的晶片城市。中央是 TSMC R&amp;D Center，六座島各有代表地標與一門半導體學問，小市民在街區與橋上穿梭。點一座島，走進它的課程。</p>
  </header>
  <div class="stage">
    <div class="map-card">
      <div class="map-tag">City Map / 城市地圖</div>
      <canvas id="scene"></canvas>
      <div id="labels"></div>
      <div class="loading" id="loading">建構城市中…</div>
      <div class="map-hint">拖曳旋轉 · 滾輪縮放 · <b>點島看課程</b></div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <footer>Prototype v1 · 課程內容參考 TSMC 半導體雲端學院</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============ data ============ */
const DISTRICTS = {
  d1:{num:'01',name:'半導體應用',sub:'Applications',landmark:'智慧應用塔',
      blurb:'晶片如何走進手錶、手機與雲端，撐起我們每天的智慧生活。',
      courses:[{t:'無所不在的晶片半導體',len:'12:00',lv:1},{t:'常見五大晶片功能',len:'12:00',lv:1},{t:'晶片間訊號的傳送處理',len:'10:00',lv:2}]},
  d2:{num:'02',name:'半導體產業',sub:'Industry',landmark:'產業鏈港口',
      blurb:'從設計、製造到封裝測試，看台灣如何用一顆顆晶片連結全世界。',
      courses:[{t:'全球晶片半導體重鎮',len:'10:00',lv:1},{t:'半導體產業鏈指南（上）',len:'05:05',lv:2},{t:'半導體產業鏈指南（下）',len:'08:05',lv:2}]},
  d3:{num:'03',name:'半導體製程',sub:'Process',landmark:'晶圓製造廠',
      blurb:'一片矽晶圓如何在無塵室裡，一層層蝕刻成數十億顆電晶體。',courses:[]},
  d4:{num:'04',name:'元件物理',sub:'Device Physics',landmark:'電晶體研究院',
      blurb:'電晶體與 p-n 接面——讓 0 與 1 得以開關的物理核心。',
      courses:[{t:'電晶體概念與應用',len:'08:00',lv:2},{t:'半導體原理說明',len:'09:00',lv:1},{t:'解鎖半導體世界',len:'06:21',lv:1},{t:'p-n 接面的生命力（上）',len:'07:05',lv:2},{t:'p-n 接面的生命力（下）',len:'06:19',lv:2},{t:'點亮科技的電晶體（上）',len:'07:57',lv:3},{t:'點亮科技的電晶體（下）',len:'07:29',lv:3},{t:'電晶體的縮小術',len:'06:45',lv:3},{t:'飛馳的電荷精靈',len:'07:15',lv:3}]},
  d5:{num:'05',name:'電子 & 電路',sub:'Circuits',landmark:'電路板廣場',
      blurb:'從原子、電流到類比與數位訊號——電路運作的基本功。',
      courses:[{t:'揭開電子的面紗',len:'05:04',lv:1},{t:'探索電流的奧秘',len:'07:26',lv:1},{t:'電子元件大解密',len:'06:11',lv:2},{t:'破解訊號的魔法',len:'05:51',lv:2}]},
  d6:{num:'06',name:'半導體材料',sub:'Materials',landmark:'矽晶礦場',
      blurb:'矽、導體與絕緣體——決定晶片效能的那層材料學問。',courses:[]},
};

/* ============ three.js setup ============ */
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const R=5.4, TILE_R=4.7, TOP=0.8, DY=Math.sqrt(3)/2*R;
const POS={core:{x:0,z:0},d1:{x:0,z:-2*DY},d2:{x:1.5*R,z:-DY},d3:{x:1.5*R,z:DY},d4:{x:0,z:2*DY},d5:{x:-1.5*R,z:DY},d6:{x:-1.5*R,z:-DY}};
const COLteal=0x35e0cf, COLgold=0xf4c45c, COLgoldDp=0xd79a2e;

const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x227f88,170,600);
const camera=new THREE.PerspectiveCamera(32,1,0.5,1400);  // perspective diorama: low angle so sky, mountains & clouds show
const target=new THREE.Vector3(0,2.2,0);
let az=-0.6, el=0.235, camRadius=78;
function placeCamera(){camera.position.set(target.x+camRadius*Math.cos(el)*Math.sin(az),target.y+camRadius*Math.sin(el),target.z+camRadius*Math.cos(el)*Math.cos(az));camera.lookAt(target);}
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}

scene.add(new THREE.HemisphereLight(0xcdf2ea,0x0c3038,1.05));
const sun=new THREE.DirectionalLight(0xffeccb,1.0); sun.position.set(16,26,12); scene.add(sun);
const rim=new THREE.DirectionalLight(0x5fe0d2,0.45); rim.position.set(-16,10,-14); scene.add(rim);

function mat(c,em,ei){return new THREE.MeshStandardMaterial({color:c,roughness:.82,metalness:.14,flatShading:true,emissive:em||0,emissiveIntensity:ei||0});}
function box(w,h,d,c,x,y,z,em,ei){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c,em,ei));m.position.set(x,y,z);return m;}
function cyl(rt,rb,h,c,x,y,z,em,ei,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat(c,em,ei));m.position.set(x,y,z);return m;}
function cone(r,h,c,x,y,z,em,ei,seg){const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,seg||6),mat(c,em,ei));m.position.set(x,y,z);return m;}

/* ---- facade textures (for supporting buildings) ---- */
function texFrom(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function facadeTex(base,floor,glass,lit){return texFrom(64,64,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);
  for(let fy=0;fy<2;fy++){x.fillStyle=floor;x.fillRect(0,fy*32+28,w,4);
    for(let fx=0;fx<2;fx++){x.fillStyle=Math.random()<lit?'#f4c45c':glass;x.fillRect(fx*32+5,fy*32+4,22,22);x.fillStyle='rgba(255,255,255,.06)';x.fillRect(fx*32+5,fy*32+4,22,3);}}});}
const FACADES=[facadeTex('#123e45','#0c2c31','#1d5660',0.28),facadeTex('#15454e','#0e3238','#227f7c',0.30),facadeTex('#1b4e63','#113748','#2a6f8a',0.26),facadeTex('#184a46','#0e332f','#1f6f66',0.33)];
function facadeMat(i){const t=FACADES[i%FACADES.length].clone();t.needsUpdate=true;t.wrapS=t.wrapT=THREE.RepeatWrapping;return new THREE.MeshStandardMaterial({map:t,emissiveMap:t,emissive:0xffffff,emissiveIntensity:.32,roughness:.7,metalness:.2});}
function supportTower(g,cx,cz,w,h,fi){
  g.add(box(w+0.2,0.24,w+0.2,0x0e3136,cx,TOP+0.12,cz));
  const body=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),facadeMat(fi));
  const t=body.material.map,e=body.material.emissiveMap,rx=Math.max(1,Math.round(w)),ry=Math.max(1,Math.round(h*0.8));
  t.repeat.set(rx,ry);e.repeat.set(rx,ry);body.position.set(cx,TOP+0.24+h/2,cz);g.add(body);
  g.add(box(w+0.08,0.12,w+0.08,0x0b2b30,cx,TOP+0.24+h+0.05,cz));
}
function tree(g,x,z,s){s=s||1;g.add(cyl(0.08,0.1,0.4*s,0x6b4a2a,x,TOP+0.2*s,z,0,0,6));g.add(cone(0.34*s,0.7*s,0x3fae52,x,TOP+0.4*s+0.35*s,z,0,0,7));}

/* ============ TSMC R&D Center (reference photo) ============ */
function buildTSMC(g){
  g.add(box(7.4,0.22,4.2,0x3fae52,0,TOP+0.11,0,0x1c5a33,.05));
  g.add(box(2.0,0.04,2.6,0x8f9a96,-0.3,TOP+0.24,1.3));
  const white=mat(0xeef1ee),grey=mat(0xcfd4d1);
  const frontMat=new THREE.MeshStandardMaterial({map:texMullion,emissiveMap:texMullion,emissive:0x8fd0d6,emissiveIntensity:.18,roughness:.5,metalness:.25});
  const hall=new THREE.Mesh(new THREE.BoxGeometry(4.3,1.7,2.0),[white,white,white,white,frontMat,white.clone()]);
  hall.position.set(-0.2,TOP+0.22+0.85,0.1);g.add(hall);
  const roofMats=[grey,grey,new THREE.MeshStandardMaterial({map:texRoofGrid,roughness:.6,metalness:.2}),grey,grey,grey];
  const roof=new THREE.Mesh(new THREE.BoxGeometry(4.7,0.24,2.5),roofMats);roof.position.set(-0.2,TOP+0.22+1.75,0);roof.rotation.x=-0.07;g.add(roof);
  g.add(box(0.8,2.3,2.1,0x9aa0a0,-2.45,TOP+0.22+1.15,0.05));
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(1.25,0.54),new THREE.MeshBasicMaterial({map:logoTex(),transparent:true}));logo.position.set(-1.7,TOP+0.22+1.15,1.12);g.add(logo);
  for(let i=0;i<4;i++) g.add(box(1.7,0.16,2.0,0xb8bcbb,2.35,TOP+0.3+i*0.5,0));
  for(const sx of [1.55,3.15]) for(const sz of [-0.9,0.9]) g.add(box(0.12,2.0,0.12,0xa7adab,sx,TOP+1.2,sz));
  const tank=cyl(0.28,0.28,0.5,0xf2f4f1,-3.1,TOP+0.47,1.4,0,0,12);g.add(tank);
  g.add(box(1.1,0.07,0.7,0x2f9fd0,-2.7,TOP+0.26,-1.3,0x1b6fa0,.25));
  const bush=(x,z)=>{g.add(box(0.34,0.26,0.34,0x3a9e4c,x,TOP+0.35,z));g.add(box(0.12,0.1,0.12,COLgold,x+0.06,TOP+0.53,z-0.04,COLgold,.3));};
  bush(-3.2,0.3);bush(-2.4,-0.4);bush(0.8,1.6);bush(3.2,1.5);bush(2.0,-1.6);
  tree(g,-3.3,-0.6,0.9);tree(g,3.3,-1.6,0.9);
  const rdpc=new THREE.Mesh(new THREE.PlaneGeometry(1.2,0.56),new THREE.MeshBasicMaterial({map:rdpcTex()}));rdpc.rotation.x=-Math.PI/2.2;rdpc.position.set(1.1,TOP+0.3,1.8);g.add(rdpc);
}
const texMullion=texFrom(256,128,(x,w,h)=>{x.fillStyle='#eef1ee';x.fillRect(0,0,w,h);for(let i=0;i<13;i++){x.fillStyle='#2f7f86';x.fillRect(6+i*19,10,11,h-20);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(6+i*19,10,3,h-20);}});
const texRoofGrid=texFrom(256,80,(x,w,h)=>{x.fillStyle='#e6e9e6';x.fillRect(0,0,w,h);for(let r=0;r<2;r++)for(let c=0;c<12;c++){x.fillStyle='#8f9795';x.fillRect(10+c*20,12+r*34,13,22);}});
function logoTex(){return texFrom(256,110,(x,w,h)=>{x.clearRect(0,0,w,h);x.fillStyle='#d9201f';x.font='bold 60px Arial';x.fillText('tsmc',8,58);x.fillStyle='#444';x.font='bold 26px Arial';x.fillText('R&D Center',10,92);});}
function rdpcTex(){return texFrom(256,120,(x,w,h)=>{x.fillStyle='#c8161a';x.fillRect(0,0,w,h);x.fillStyle='#fff';x.font='bold 70px Arial';x.textAlign='center';x.fillText('RDPC',w/2,82);});}

/* ============ district landmarks ============ */
function plaza(g,c){g.add(box(5.6,0.16,5.0,c||0x123f46,0,TOP+0.08,0,0x0a3038,.05));}

// 01 應用：巨型智慧型手機塔 + app 方塊
function lm_d1(g){
  plaza(g,0x14343c);

function bigMountain(x,z,s){
  const g=new THREE.Group();g.position.set(x,-0.4,z);g.rotation.y=Math.random()*Math.PI*2;
  const peaks=2+((Math.random()*3)|0);
  for(let i=0;i<peaks;i++){
    const hh=(13+Math.random()*15)*s, rr=(11+Math.random()*8)*s;
    const px=(Math.random()-0.5)*22*s, pz=(Math.random()-0.5)*15*s;
    const tint=0x14525d+((Math.random()*0x050505)|0);
    g.add(cone(rr,hh,tint,px,hh/2,pz,0,0,5));
    if(hh>22*s) g.add(cone(rr*0.32,hh*0.2,0xd3e6e6,px,hh-hh*0.1,pz,0,0,5)); // snow cap
  }
  scene.add(g);
}

function updateLabels(){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  for(const L of labelData){
    _v.copy(L.anchor).project(camera);
    const x=(_v.x*.5+.5)*w,y=(-_v.y*.5+.5)*h;
    L.el.style.transform=`translate(${x}px,${y}px) translate(-50%,-108%)`;

  t.material.emissiveIntensity=on?.4:hov?.26:(core?.08:.06);t.material.emissive.setHex(on||hov?(core?0x2f8f55:COLteal):(core?0x1c5a33:0x0a3a40));});}
let dragging=false,moved=0,lastX=0,lastY=0,downT=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;moved=0;lastX=e.clientX;lastY=e.clientY;downT=Date.now();canvas.classList.add('grabbing');canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(dragging){const dx=e.clientX-lastX,dy=e.clientY-lastY;moved+=Math.abs(dx)+Math.abs(dy);az-=dx*0.006;el=Math.max(0.14,Math.min(1.05,el-dy*0.004));lastX=e.clientX;lastY=e.clientY;placeCamera();}else{setPointer(e);const id=pick();if(id!==hovered){hovered=id;canvas.classList.toggle('hot',!!id);refreshHighlight();}}});
function endDrag(e){dragging=false;canvas.classList.remove('grabbing');if(moved<6&&Date.now()-downT<400){setPointer(e);const id=pick();if(id)go(id);}}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',()=>{dragging=false;canvas.classList.remove('grabbing');});
canvas.addEventListener('wheel',e=>{e.preventDefault();camRadius=Math.max(26,Math.min(130,camRadius+Math.sign(e.deltaY)*camRadius*0.1));placeCamera();},{passive:false});

/* ============ animation ============ */
let t0=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-t0)/1000);t0=now;
  if(!REDUCE){
    if(!dragging) az+=0.04*dt;
    for(const q of people){
      let vx=0,vz=0;
      if(q.mode==='tile'){const dx=q.tgt.x-q.g.position.x,dz=q.tgt.z-q.g.position.z,d=Math.hypot(dx,dz);
        if(d<0.15){q.tgt=tilePoint(q.p);}else{vx=dx/d*q.spd;vz=dz/d*q.spd;q.g.position.x+=vx*dt;q.g.position.z+=vz*dt;}}
      else{q.t+=q.dir*q.spd*dt;if(q.t>1){q.t=1;q.dir=-1;}if(q.t<0){q.t=0;q.dir=1;}const r=q.b.inner+(q.b.outer-q.b.inner)*q.t;q.g.position.x=q.b.dx*r;q.g.position.z=q.b.dz*r;vx=q.b.dx*q.dir;vz=q.b.dz*q.dir;}
      if(vx||vz)q.g.rotation.y=Math.atan2(vx,vz);
      const sw=Math.sin(now/1000*8+q.ph)*0.5;
      q.legL.rotation.x=sw;q.legR.rotation.x=-sw;q.armL.rotation.x=-sw*0.8;q.armR.rotation.x=sw*0.8;
      q.g.position.y=TOP+Math.abs(Math.sin(now/1000*8+q.ph))*0.04;
    }
    for(const p of particles){p.t-=0.18*dt;if(p.t<0)p.t=1;const r=p.b.inner+(p.b.outer-p.b.inner)*p.t;p.m.position.set(p.b.dx*r,TOP+0.55,p.b.dz*r);}
    seaInner.material.opacity=0.5+Math.sin(now/1400)*0.12;
    clouds.rotation.y+=0.006*dt;clouds.position.y=Math.sin(now/3000)*0.6;
  }
  placeCamera();renderer.render(scene,camera);updateLabels();requestAnimationFrame(frame);
}

/* ============ panel ============ */
const panel=document.getElementById('panel');
const totalCourses=Object.values(DISTRICTS).reduce((n,d)=>n+d.courses.length,0);
function dots(lv){return '<span class="dot">'+'●'.repeat(lv)+'</span>'+'○'.repeat(3-lv)}
function renderOverview(){
  const chips=Object.keys(DISTRICTS).map(id=>{const d=DISTRICTS[id],n=d.courses.length;return `<button class="chip-btn" data-id="${id}"><span class="cn">${d.num}</span><span class="ct">${d.name}</span><span class="cc">${n?n+' 門課程':'課程準備中'}</span></button>`;}).join('');
  panel.innerHTML=`<div class="panel-eyebrow">City Overview / 城市總覽</div>
    <div class="panel-head"><span class="panel-num">★</span><div><h2 class="panel-title">TSMC R&amp;D Center</h2><p class="panel-sub">The Core</p></div></div>
    <p class="panel-blurb">所有區塊的電流最終都流回這裡。核心研發中心把六大領域的知識整合成一顆顆真實的晶片，是這座城市運轉的心臟。</p>
    <div class="panel-meta"><span><b class="tnum">6</b> 個區塊</span><span><b class="tnum">${totalCourses}</b> 門課程</span><span><b class="tnum">2</b> 區建置中</span></div>
    <div class="chips">${chips}</div>
    <p class="panel-foot">原型版 v1：拖曳可旋轉城市、滾輪縮放，點任一座島、浮動標籤或下方卡片進入該區塊。課程內容取自 TSMC 半導體雲端學院，實際影片連結尚未接上。</p>`;
  activeId=null;refreshHighlight();
}
function renderDistrict(id){const d=DISTRICTS[id];let body;
  if(d.courses.length){body='<div class="course-list">'+d.courses.map((c,i)=>`<div class="ctitle"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="ct">${c.t}</span></div>`).join('')+'</div>';}
  else{body=`<div class="empty"><div class="empty-badge">課程準備中</div><p>${d.name}的課程正在建置，敬請期待。</p></div>`;}
  panel.innerHTML=`<button class="back" data-back="1">‹ 回城市總覽</button>
    <div class="panel-eyebrow">District ${d.num} / ${d.sub}</div>
    <div class="panel-head"><span class="panel-num">${d.num}</span><div><h2 class="panel-title">${d.name}</h2><p class="panel-sub">${d.landmark}</p></div></div>
    <p class="panel-blurb">${d.blurb}</p>
    <div class="panel-meta"><span><b class="tnum">${d.courses.length||'—'}</b> 門課程</span><span>${d.courses.length?'可開始學習':'建置中'}</span></div>
    ${body}<p class="panel-foot">原型版 v1：課程卡片為示意，點擊尚未連到實際影片。</p>`;
  activeId=id;refreshHighlight();
}
function go(id){if(!id||id==='core'){renderOverview()}else{renderDistrict(id)}}
panel.addEventListener('click',e=>{if(e.target.closest('[data-back]')){go('core');return}const c=e.target.closest('.chip-btn');if(c)go(c.dataset.id);});

/* boot */
addEventListener('resize',resize);
resize();placeCamera();renderOverview();
document.getElementById('loading').remove();
requestAnimationFrame(frame);
</script>
